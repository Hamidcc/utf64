<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>utf64 | Development Portfolio</title>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8965D6">

<meta name="description" content="utf64 is a development portfolio showcasing previous work, projects, and engineering builds.">
<meta name="keywords" content="utf64, development portfolio, projects, coding, engineering, unicode, utf8">
<meta name="robots" content="index, follow">

<link rel="stylesheet" href="beer.css">

<style>
body{opacity:0;animation:fadeIn 1s ease forwards}
@keyframes fadeIn{to{opacity:1}}

.pop{
position:fixed;
font-weight:900;
pointer-events:none;
animation:pop 900ms cubic-bezier(.2,.9,.3,1) forwards;
}
@keyframes pop{
0%{transform:scale(.3) translateY(0);opacity:1}
70%{transform:scale(1.6) translateY(-60px)}
100%{transform:scale(1) translateY(-90px);opacity:0}
}
</style>

<script>
const words=[
"code","utf","development","unicode","utf64",
"67","utf8","cyclone","affordable"
]

document.addEventListener("click",e=>{
const el=document.createElement("div")
el.className="pop"
el.textContent=words[Math.floor(Math.random()*words.length)]
el.style.left=e.clientX+"px"
el.style.top=e.clientY+"px"
document.body.appendChild(el)
setTimeout(()=>el.remove(),900)
})
</script>
</head>

<body class="middle-align center-align counting-background">

<section class="center-align margin">

<div class="center center-align middle-align flex-wrap">
<img id="avatar" class="counting-icon" src="icon.png">
<h2 class="red-text no-margin" style="
font-weight:900;
background:var(--accent-gradient);
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
color:transparent;
display:inline-block;
"> utf64 </h2>
</div>

<h5 class="center-align white-text small">
Previous Work
</h5>

<div class="large-margin">

<a href="https://cc.utf64.com">
<button class="red9 white-text tiny-margin wave">
<i>timer_10</i>
<span>CountyCount</span>
</button>
</a>

<a href="/roblox">
<button class="red9 white-text tiny-margin wave">
<i>robot_2</i>
<span>Roblox</span>
</button>
</a>

<a href="/about">
<button class="red9 white-text tiny-margin wave">
<i>person</i>
<span>About</span>
</button>
</a>

<a href="/contact">
<button class="red9 white-text tiny-margin wave">
<i>mail</i>
<span>Contact</span>
</button>
</a>

</div>

</section>

<script>
async function loadAvatar(){
document.getElementById("avatar").src="icon.png?v="+Date.now()
}
loadAvatar()

const avatar=document.querySelector(".counting-icon")
const MAX_TILT=20
const MAX_DISTANCE=220
let currentX=0
let currentY=0

document.addEventListener("mousemove",e=>{
const rect=avatar.getBoundingClientRect()
const cx=rect.left+rect.width/2
const cy=rect.top+rect.height/2

let dx=e.clientX-cx
let dy=e.clientY-cy
const distance=Math.sqrt(dx*dx+dy*dy)

if(distance>MAX_DISTANCE){
dx*=MAX_DISTANCE/distance
dy*=MAX_DISTANCE/distance
}

const targetX=(-dy/MAX_DISTANCE)*MAX_TILT
const targetY=(dx/MAX_DISTANCE)*MAX_TILT

currentX+=(targetX-currentX)*0.15
currentY+=(targetY-currentY)*0.15

const scale=avatar.matches(":hover")?1.18:1
avatar.style.transform=`perspective(600px) rotateX(${currentX}deg) rotateY(${currentY}deg) scale(${scale})`
})
</script>

</body>
</html>
